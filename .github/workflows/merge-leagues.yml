name: Merge duplicate leagues

# Folds extra copies of the same EA league (e.g. a PC player's copy of a PS5
# cross-play league) into the oldest one. See scripts/merge-leagues/merge.ts.
# Run by hand, or by pushing a change to scripts/merge-leagues/run.txt
# (line 1 is the mode, dry or apply; line 2 optionally an EA league id).

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry = report only, check = fail if any duplicates, apply = merge"
        default: "dry"
  # Weekly safety net: fails (so GitHub emails the repo owner) if any EA league
  # has more than one site again.
  schedule:
    - cron: "37 14 * * 1"
  push:
    branches: [main]
    paths: ["scripts/merge-leagues/run.txt"]

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Merge
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          MODE="${{ inputs.mode }}"
          ONLY=""
          if [ "${{ github.event_name }}" = "schedule" ]; then MODE="check"
          elif [ -z "$MODE" ]; then MODE="$(head -n1 scripts/merge-leagues/run.txt | tr -d '[:space:]')"; ONLY="$(sed -n 2p scripts/merge-leagues/run.txt | tr -dc '0-9')"; fi
          echo "Mode: $MODE  EA league: ${ONLY:-all}"
          MODE="$MODE" EA_LEAGUE_ID="$ONLY" npx tsx scripts/merge-leagues/merge.ts
